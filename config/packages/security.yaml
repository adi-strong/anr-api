    - { path: ^/api/fuels, roles: ROLE_AG, methods: PATCH }
    - { path: ^/api/fuel_supplies, roles: ROLE_AG, methods: GET }
    - { path: ^/api/fuel_supplies, roles: ROLE_AG, methods: POST }
    - { path: ^/api/refuelings, roles: ROLE_USER, methods: GET }
